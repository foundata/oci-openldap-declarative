[project]
name = "openldap-declarative-tests"
version = "0.0.0"
requires-python = ">=3.12,<3.15"

[dependency-groups]
dev = [
  "argon2-cffi",
  "jsonschema[format]",
  "mypy",
  "pytest>=9.0",
  "pytest-testinfra",
  "python-ldap",
  "pyyaml",
  "ruff",
  "types-pyyaml",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
filterwarnings = ["error"]
markers = [
  "integration: needs rootless Podman, an image source and real time",
]
strict = true
testpaths = ["tests/unit"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["generator", "tests"]
